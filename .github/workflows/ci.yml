name: MoonTestLedger

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        target: [wasm, wasm-gc, js, native]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - name: Configure the Windows native compiler
        if: runner.os == 'Windows' && matrix.target == 'native'
        uses: ilammy/msvc-dev-cmd@v1
      - name: Install the validated stable MoonBit release
        uses: hustcer/setup-moonbit@9199da0ab63ea0c0bab1dc15f03d76e17ed4f75f # v1.22
        with:
          version: 0.10.15+943464bfa
          core-version: 0.10.15+943464bfa
      - name: Resolve pinned module dependencies
        run: moon update
      - name: Check formatting, interfaces, strict check/build, tests and applicable CLI workflows
        if: runner.os != 'Linux' || matrix.target != 'native'
        run: moon run scripts/verify.mbtx ${{ matrix.target }}
      - name: Install native process tracer
        if: runner.os == 'Linux' && matrix.target == 'native'
        run: sudo apt-get install --yes strace
      - name: Trace native verification without retrying a failure
        if: runner.os == 'Linux' && matrix.target == 'native'
        run: |
          mkdir -p output
          moon run scripts/diagnose-native.mbtx output/native-signal-probe 1 --self-test
          moon run scripts/diagnose-native.mbtx output/native-diagnostics 1
      - name: Preserve native diagnostics on failure
        if: failure() && runner.os == 'Linux' && matrix.target == 'native'
        uses: actions/upload-artifact@v7
        with:
          name: native-diagnostics
          path: |
            output/native-diagnostics/
            output/native-signal-probe/
          if-no-files-found: warn
          retention-days: 7
      - name: Check an independent consumer against a clean Git source export
        run: moon run scripts/check-consumer.mbtx ${{ matrix.target }}
