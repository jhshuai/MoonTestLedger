name: CI evidence delivery example
run-name: Evidence delivery · ${{ inputs.collection }} · ${{ inputs.artifact_root }}

on:
  workflow_dispatch:
    inputs:
      collection:
        description: Repository-relative full collection specification
        required: true
        default: examples/upstream/collection.json
        type: string
      artifact_root:
        description: Repository-relative XML artifact directory
        required: true
        default: examples/upstream
        type: string

permissions:
  contents: read

jobs:
  evidence:
    runs-on: ubuntu-latest
    outputs:
      evidence_sha256: ${{ steps.receipt.outputs.evidence_sha256 }}
      gate: ${{ steps.receipt.outputs.gate }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: hustcer/setup-moonbit@9199da0ab63ea0c0bab1dc15f03d76e17ed4f75f
        with:
          version: 0.10.15+943464bfa
          core-version: 0.10.15+943464bfa
      - run: moon update
      - name: Collect the complete declared inventory as UTF-8 evidence
        env:
          COLLECTION: ${{ inputs.collection }}
          ARTIFACT_ROOT: ${{ inputs.artifact_root }}
        run: moon run --target wasm cmd/moontestledger -- collect "$COLLECTION" "$ARTIFACT_ROOT" --output run-evidence.json
      - name: Preserve the evidence and report before applying its test gate
        run: moon run --target wasm cmd/moontestledger -- ci-report run-evidence.json ci-evidence
      - name: Record the creation receipt outside the uploaded artifact
        id: receipt
        if: always()
        run: moon run scripts/check-ci-delivery.mbtx record ci-evidence
      - name: Upload the delivery even when its test gate fails
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-evidence
          path: ci-evidence/
          if-no-files-found: error
          retention-days: 7

  verify-download:
    needs: evidence
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: hustcer/setup-moonbit@9199da0ab63ea0c0bab1dc15f03d76e17ed4f75f
        with:
          version: 0.10.15+943464bfa
          core-version: 0.10.15+943464bfa
      - run: moon update
      - name: Download the evidence on an independent runner
        uses: actions/download-artifact@v8
        with:
          name: test-evidence
          path: downloaded-evidence
      - name: Replay the original test gate offline
        run: moon run --target wasm cmd/moontestledger -- verify-delivery downloaded-evidence
      - name: Assert transport integrity and gate preservation
        if: always()
        env:
          EXPECTED_SHA256: ${{ needs.evidence.outputs.evidence_sha256 }}
          EXPECTED_GATE: ${{ needs.evidence.outputs.gate }}
        run: moon run scripts/check-ci-delivery.mbtx check downloaded-evidence "$EXPECTED_SHA256" "$EXPECTED_GATE"
